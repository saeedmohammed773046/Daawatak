<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <linearGradient id="glowDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Icon (Glowing Luxury Motif) -->
  <g transform="translate(10, 10)">
    <!-- Outer Dark Card Base -->
    <rect x="15" y="25" width="70" height="50" rx="10" fill="#1E293B" stroke="url(#goldDark)" stroke-width="1.5"/>
    <!-- Envelope Flap -->
    <path d="M15 35 L50 60 L85 35" stroke="url(#goldDark)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowEffect)"/>
    <!-- Sparkle Motif -->
    <path d="M50 15 L54 24 L63 25 L56 31 L58 40 L50 35 L42 40 L44 31 L37 25 L46 24 Z" fill="url(#goldDark)"/>
    <!-- Center Cyan Accent -->
    <circle cx="50" cy="50" r="4" fill="url(#glowDark)"/>
  </g>

  <!-- Brand Name Typography -->
  <!-- Arabic Text in Crisp White/Gold -->
  <text x="110" y="58" font-family="'Segoe UI', 'Tajawal', 'Cairo', sans-serif" font-size="34" font-weight="800" fill="#F8FAFC" letter-spacing="0">
    دَعْوَتُكَ
  </text>
  <!-- English Subtitle -->
  <text x="112" y="82" font-family="'Inter', 'Montserrat', sans-serif" font-size="13" font-weight="600" fill="#FFD700" letter-spacing="3">
    DAAWATAK • VIP EVENTS
  </text>
</svg>
